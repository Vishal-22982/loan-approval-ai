<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loan Approval AI</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glass Card */
.container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    width: 400px;
    box-shadow: 0 0 30px rgba(0,0,0,0.3);
}

/* Title */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* Inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* Result */
.result {
    margin-top: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

/* Loader */
.loader {
    display: none;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
    <h2>💳 Loan Approval Predictor</h2>

    <input id="income" placeholder="Applicant Income">
    <input id="coincome" placeholder="Coapplicant Income">
    <input id="age" placeholder="Age">
    <input id="credit" placeholder="Credit Score">
    <input id="loans" placeholder="Existing Loans">
    <input id="dti" placeholder="DTI Ratio">
    <input id="savings" placeholder="Savings">
    <input id="collateral" placeholder="Collateral Value">
    <input id="amount" placeholder="Loan Amount">
    <input id="term" placeholder="Loan Term">

    <button onclick="predict()">🚀 Predict Loan</button>

    <div class="loader" id="loader">⏳ Processing...</div>
    <div class="result" id="result"></div>
</div>

<script>
async function predict() {
    document.getElementById("loader").style.display = "block";
    document.getElementById("result").innerHTML = "";

    const data = {
        Applicant_Income: parseFloat(document.getElementById("income").value),
        Coapplicant_Income: parseFloat(document.getElementById("coincome").value),
        Age: parseFloat(document.getElementById("age").value),
        Credit_Score: parseFloat(document.getElementById("credit").value),
        Existing_Loans: parseFloat(document.getElementById("loans").value),
        DTI_Ratio: parseFloat(document.getElementById("dti").value),
        Savings: parseFloat(document.getElementById("savings").value),
        Collateral_Value: parseFloat(document.getElementById("collateral").value),
        Loan_Amount: parseFloat(document.getElementById("amount").value),
        Loan_Term: parseFloat(document.getElementById("term").value)
    };

    try {
        const res = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await res.json();

        document.getElementById("loader").style.display = "none";

        if(result.prediction === 1){
            document.getElementById("result").innerHTML = "✅ Loan Approved";
            document.getElementById("result").style.color = "#00ff9d";
        } else {
            document.getElementById("result").innerHTML = "❌ Loan Rejected";
            document.getElementById("result").style.color = "#ff4d4d";
        }

    } catch (error) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("result").innerHTML = "⚠️ Server Error";
    }
}
</script>

</body>
</html>
